project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about/index.qmd
    # Unlisted: generates the R-only feed submitted to R-bloggers.
    - r-feed.qmd
    - subscribe/index.qmd
    - post/
  resources:
    - fonts/
    - apple-touch-icon.png
    - icon.svg
  # Quarto leaves cross-post links in the feeds page-relative, which breaks
  # them wherever a feed item is republished. Standard library only, so CI
  # needs nothing installed.
  post-render:
    - python3 tools-absolutize-feed-links.py

website:
  title: "econometrics.blog"
  site-url: https://www.econometrics.blog
  favicon: favicon.png
  navbar:
    left:
      - href: index.qmd
        text: Contents
      # The homepage listing reads #category=... on load, so this filters the
      # contents down to the puzzler series without needing a page of its own.
      - href: "/#category=puzzler"
        text: Puzzlers
      - href: about/index.qmd
        text: About
      - href: subscribe/index.qmd
        text: Subscribe
      - href: index.xml
        text: Feed
  page-footer:
    # The R-bloggers link is a condition of being aggregated there: "Link to
    # R-bloggers from your blogroll (sidebar), and/or from a post."
    center: "&copy; 2020&ndash;2026 Francis J. DiTraglia &nbsp;&middot;&nbsp; [Source on GitHub](https://github.com/fditraglia/econometrics.blog) &nbsp;&middot;&nbsp; [Feed](/index.xml) &nbsp;&middot;&nbsp; [R-bloggers](https://www.r-bloggers.com/)"
  comments:
    utterances:
      repo: fditraglia/econometrics.blog-comments
      issue-term: pathname
      theme: github-light

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    code-fold: false
    highlight-style: github
    include-in-header:
      - _fonts.html
      - text: |
          <link rel="apple-touch-icon" href="/apple-touch-icon.png">
          <!-- Declared alongside the PNG rather than instead of it: browsers
               that understand SVG favicons take this one, which carries a
               prefers-color-scheme rule so the mark does not sit in a dark tab
               strip as a bright cream square. Safari falls back to the PNG. -->
          <link rel="icon" type="image/svg+xml" href="/icon.svg">

    include-after-body:
      - text: |
          <script data-goatcounter="https://econometrics.goatcounter.com/count"
                  async src="//gc.zgo.at/count.js"></script>
      - _math-fit.html
      - _listing-tidy.html
      - _theme.html

knitr:
  opts_chunk:
    dev: svglite
    dev.args:
      bg: "#f8f6f1"
      pointsize: 14

freeze: auto
