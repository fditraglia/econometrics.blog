<script>
// Theme behaviors: the wordmark split, and the homepage's two-view contents.
// Everything here is progressive enhancement -- with JavaScript disabled the
// page shows the full subject view and a plain wordmark, and loses only the
// toggle, the "five more" folding and the live category filter.
(function () {
  document.documentElement.classList.add('js');

  function ready(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn);
    } else {
      fn();
    }
  }

  // ---- margin notes: sit level with their markers ----
  // Quarto aligns a margin footnote with the top of the paragraph that cites
  // it, so a note citing the last sentence of a long paragraph appears well
  // before the passage it belongs to. This slides each note down to its own
  // marker, keeping notes in order and never overlapping. Offsets are
  // position: relative, so nothing else on the page moves.
  function alignMarginNotes() {
    var notes = [].slice.call(
      document.querySelectorAll('.column-margin div[id^="fn"]'));
    if (!notes.length) return;
    var main = document.querySelector('main');
    // Pair each note with its marker and order by the marker's position in
    // the text -- Quarto hoists a fold's notes out in reverse DOM order, so
    // document order of the notes cannot be trusted for stacking.
    var pairs = [];
    notes.forEach(function (note) {
      note.style.top = '';
      var m = note.id.match(/^fn(\d+)$/);
      var marker = m && document.getElementById('fnref' + m[1]);
      if (!marker) return;
      // Notes belonging to a closed solution fold are display:none (and so
      // are their markers); they get aligned when the fold opens.
      if (!note.offsetParent || !marker.offsetParent) return;
      pairs.push({ note: note, marker: marker });
    });
    pairs.sort(function (a, b) {
      return a.marker.getBoundingClientRect().top -
             b.marker.getBoundingClientRect().top;
    });
    var lastBottom = -Infinity;
    pairs.forEach(function (pair) {
      var note = pair.note;
      var rect = note.getBoundingClientRect();
      // Only when the note actually sits in the margin column; on narrow
      // screens Quarto folds it into the body flow, which needs no help.
      if (main && rect.left < main.getBoundingClientRect().left +
                  (document.querySelector('main p') || main).clientWidth * 0.8) {
        return;
      }
      var naturalTop = rect.top + window.scrollY;
      var markerTop = pair.marker.getBoundingClientRect().top + window.scrollY;
      var target = Math.max(markerTop, lastBottom + 14);
      note.style.position = 'relative';
      note.style.top = (target - naturalTop) + 'px';
      lastBottom = target + rect.height;
    });
  }

  function scheduleAlign() {
    alignMarginNotes();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(alignMarginNotes);
    }
    if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
      MathJax.startup.promise.then(function () {
        setTimeout(alignMarginNotes, 50);
      });
    }
    window.addEventListener('load', alignMarginNotes);
    var t;
    window.addEventListener('resize', function () {
      clearTimeout(t);
      t = setTimeout(alignMarginNotes, 150);
    });
    // A solution fold reveals its margin notes when it opens; align them
    // once the collapse animation has finished.
    [].slice.call(document.querySelectorAll('.callout-header'))
      .forEach(function (h) {
        h.addEventListener('click', function () {
          setTimeout(alignMarginNotes, 450);
        });
      });
  }

  ready(function () {
    scheduleAlign();

    // ---- wordmark: "econometrics" upright, ".blog" italic vermilion ----
    var brand = document.querySelector('.navbar-brand .navbar-title') ||
                document.querySelector('.navbar-brand');
    if (brand && brand.textContent.indexOf('.blog') !== -1 &&
        !brand.querySelector('.brand-tld')) {
      brand.innerHTML = brand.textContent.replace(
        '.blog', '<span class="brand-tld">.blog</span>');
    }

    // Everything below is homepage-only.
    var subjectView = document.querySelector('.view-by-subject');
    if (!subjectView) return;

    // ---- margin block: move it into the margin sidebar, above the filter ----
    var marginSource = document.querySelector('.home-margin-source .home-margin');
    var sidebar = document.getElementById('quarto-margin-sidebar');
    if (marginSource && sidebar) {
      sidebar.insertBefore(marginSource, sidebar.firstChild);
    }

    // ---- category filter list: retitle and set the counts in mono ----
    var catTitle = document.querySelector('.quarto-listing-category-title');
    if (catTitle) catTitle.textContent = 'Filter';
    [].slice.call(document.querySelectorAll('.quarto-listing-category .category'))
      .forEach(function (el) {
        var m = el.textContent.match(/^(.*?)\s*\((\d+)\)\s*$/);
        if (m) {
          el.textContent = '';
          el.appendChild(document.createTextNode(m[1] + ' '));
          var n = document.createElement('span');
          n.className = 'cat-count';
          n.textContent = m[2];
          el.appendChild(n);
        }
      });

    // ---- hero: keep only the first sentence of the excerpt ----
    // _listing-tidy.html has already stripped any half-truncated math; it
    // registered its DOMContentLoaded listener first, so it has run by now.
    var heroDesc = document.querySelector('.hero-description a');
    if (heroDesc) {
      var text = heroDesc.textContent.trim();
      var m = text.match(/^[\s\S]*?[.?!](?=\s|$)/);
      if (m && m[0].length > 40) heroDesc.textContent = m[0];
    }

    // ---- view toggle ----
    var KEY = 'econblog-home-view';
    var btnSubject = document.querySelector('.view-toggle .toggle-subject');
    var btnDate = document.querySelector('.view-toggle .toggle-date');

    function setView(view, persist) {
      document.body.classList.toggle('home-view-date', view === 'date');
      if (btnSubject && btnDate) {
        btnSubject.classList.toggle('active', view !== 'date');
        btnSubject.setAttribute('aria-pressed', view !== 'date');
        btnDate.classList.toggle('active', view === 'date');
        btnDate.setAttribute('aria-pressed', view === 'date');
      }
      if (persist) {
        try { localStorage.setItem(KEY, view); } catch (e) {}
      }
    }

    if (btnSubject && btnDate) {
      btnSubject.addEventListener('click', function () { setView('subject', true); });
      btnDate.addEventListener('click', function () { setView('date', true); });
      var stored = null;
      try { stored = localStorage.getItem(KEY); } catch (e) {}
      if (stored === 'date') setView('date', false);
    }

    // ---- "five more": collapse long sections down to four lines ----
    var sections = [].slice.call(document.querySelectorAll('.subject-section'));
    sections.forEach(function (sec) {
      if (!sec.querySelector('.more-line')) return;
      sec.classList.add('section-collapsed');
      var btn = sec.querySelector('.more-toggle');
      if (btn) {
        btn.addEventListener('click', function () {
          sec.classList.remove('section-collapsed');
        });
      }
    });

    // ---- category filter adapter ----
    // Quarto's filter drives List.js, whose items are the hidden stubs. This
    // mirrors the stubs' visibility onto the lines of both views, the hero
    // and the puzzler block, all of which carry data-indexes.
    var targets = [].slice.call(
      document.querySelectorAll('[data-indexes]'));

    function applyFilter(list) {
      var total = list.items.length;
      var visible = {};
      list.visibleItems.forEach(function (it) {
        visible[String(it.values().index)] = true;
      });
      var filtering = list.visibleItems.length < total;

      targets.forEach(function (el) {
        var idxs = el.getAttribute('data-indexes').split(',');
        var shown = idxs.some(function (i) { return visible[i]; });
        el.classList.toggle('filtered-out', !shown);
      });

      // A series group's label goes when every one of its parts is gone.
      [].slice.call(document.querySelectorAll('.series-group'))
        .forEach(function (g) {
          var any = g.querySelector('[data-indexes]:not(.filtered-out)');
          g.classList.toggle('filtered-out', !any);
        });

      // Recount each section from its visible lines; hide emptied sections.
      [].slice.call(document.querySelectorAll('.subject-section, .year-section'))
        .forEach(function (sec) {
          var n = 0;
          [].slice.call(sec.querySelectorAll('[data-indexes]:not(.filtered-out)'))
            .forEach(function (line) {
              n += line.getAttribute('data-indexes').split(',').length;
            });
          var count = sec.querySelector('.subject-count, .year-count');
          if (count) {
            count.textContent = filtering ? n : count.getAttribute('data-total');
          }
          sec.classList.toggle('filtered-out', n === 0);
          // A match hidden behind "five more" would be invisible, so an
          // active filter expands every section; clearing it re-collapses.
          if (sec.querySelector('.more-line')) {
            sec.classList.toggle('section-collapsed', !filtering);
          }
        });
    }

    // The List instance is created by an inline script and the filter can be
    // applied from the URL hash slightly later, so attach when it appears.
    var tries = 0;
    (function attach() {
      var lists = window['quarto-listings'];
      var list = lists && lists['listing-listing'];
      if (!list) {
        if (++tries < 100) setTimeout(attach, 50);
        return;
      }
      list.on('updated', function () { applyFilter(list); });
      applyFilter(list);
    })();
  });
})();
</script>

<script>
// A subscribe form at the end of every post, above the comments.
//
// Quarto has no hook meaning "end of the article body": include-after-body
// lands below the page footer, and an include in each post would touch all
// forty of them and invalidate _freeze for every one. So the block is appended
// here, the same DOM-editing approach this file already uses to move the
// margin block into the sidebar and to wire the home page's views. Utterances
// injects the comment thread after </main>, so appending to the article body
// puts this above the comments without having to find them.
//
// With JavaScript off nothing appears, which is acceptable for a nicety; the
// /subscribe/ page carries the same form as ordinary markup and always works.
(function () {
  if (location.pathname.indexOf('/post/') === -1) return;

  document.addEventListener('DOMContentLoaded', function () {
    var main = document.querySelector('main#quarto-document-content')
            || document.querySelector('main.content')
            || document.querySelector('main');
    if (!main || main.querySelector('.subscribe-block')) return;

    var block = document.createElement('div');
    block.className = 'subscribe-block';
    // No eyebrow label above this. "Subscribe" as a heading and "Subscribe"
    // on the button are the same word in the same mono vermilion, so the two
    // were indistinguishable and nothing marked which one was clickable. The
    // sentence does the heading's job, and the button is then the only
    // accented thing in the block.
    block.innerHTML =
      '<p class="subscribe-pitch">An email whenever a new post appears, and ' +
      'nothing else.</p>' +
      '<form class="subscribe-form" method="post" target="_blank" ' +
      'action="https://buttondown.com/api/emails/embed-subscribe/fditraglia">' +
      '<label for="bd-email-post">Email address</label>' +
      '<input type="email" name="email" id="bd-email-post" ' +
      'placeholder="you@example.com" autocomplete="email" required>' +
      '<button type="submit">Subscribe</button>' +
      '</form>';
    main.appendChild(block);
  });
})();
</script>
