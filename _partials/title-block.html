<header id="title-block-header" class="quarto-title-block default">
<div class="quarto-title">
<p class="post-eyebrow">
$if(eyebrow)$<span class="eyebrow-item">$eyebrow$</span>$elseif(subject)$<span class="eyebrow-item">$subject$</span>$endif$
$if(date)$<span class="eyebrow-item">$date$</span>$endif$
$if(reading-time)$<span class="eyebrow-item">$reading-time$</span>$endif$
$if(series-position)$<span class="eyebrow-item">$series-position$</span>$endif$
</p>
$if(title)$
<h1 class="title">$title$</h1>
$endif$
$if(subtitle)$
<p class="subtitle lead">$subtitle$</p>
$endif$
</div>
</header>
